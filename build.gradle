plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("com.gradleup.shadow") version "9.6.1"
}

group = 'com.roguesmp'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven { url = 'https://jitpack.io' }
    maven {
        url = 'https://repo.extendedclip.com/releases/'
    }

    maven {
        name = "enginehub"
        url = "https://maven.enginehub.org/repo/"
    }

    maven {
        url = "https://repo.minehub.live/releases"
    }

    maven { url = "https://repo.onarandombox.com/content/groups/public/" }
}
dependencies {
    compileOnly("io.papermc.paper:paper-api:26.2.build.+")
    compileOnly("dev.jorel:commandapi-paper-core:12.0.0")
    compileOnly("com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit:2.16.0")
    compileOnly('com.github.NEZNAMY:TAB-API:6.1.2')
    compileOnly('me.clip:placeholderapi:2.12.3')
    compileOnly 'org.mvplugins.multiverse.core:multiverse-core:5.8.1-SNAPSHOT'
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.19'
    compileOnly("live.minehub:polarpaper:2.3.0")
    implementation('org.apache.commons:commons-math3:3.6.1')
    implementation("com.github.ben-manes.caffeine:caffeine:3.2.4")
    implementation 'fr.skytasul:glowingentities:2.0.1'
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21")
    }
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    relocate 'fr.skytasul.glowingentities', 'com.roguesmp.libs.glowingentities'
    configurations = [project.configurations.runtimeClasspath]
}
